<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>EdgeBox-Nova LLM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/modal.css" />
    <link rel="stylesheet" href="/css/select-lang.css" />
</head>

<body>

<header class="app-header">
    <img src="images/logo3.png" width="90px"/>
    <h1>EdgeBox-Nova LLM</h1>
    <button class="back-btn" onclick="window.location.href='https://llmcore.ai/en/edgebox-nova'">
        BACK TO WEBSITE
    </button>
    <button class="theme-btn" id="theme-toggle">
        <span class="theme-icon">☀️</span>
        <span class="theme-text">Light Mode</span>
    </button>
</header>
<div class="content-box-page">
    <button class="demo-btn" onclick="window.location.href='demo-single.html'">
        Real-time translation (single user demo)
    </button>
    <button class="demo-btn" onclick="openModal()">
        Connect with someone else
    </button>
</div>

<footer class="app-footer">
    <div class="footer-left">
        <span>© 2026 EdgeBox-Nova</span>
    </div>

    <div class="footer-center">
        <span>Real-time Speech · Transcription · Translation</span>
    </div>

    <div class="footer-right">
        <a href="https://llmcore.ai/en/edgebox-nova">llmcore.ai</a>
    </div>
</footer>

<script src="/src/lang-select.js"></script>
<script src="/src/theme-toggle.js"></script>
<script src="/src/modal.js"></script>

<!-- Modal -->
<div class="modal-overlay" id="room-modal">
    <div class="modal">
        <h2>Connect to a room</h2>

        <div class="lang-option">
            <div class="select" id="select-audio">
                <button class="select-trigger" id="select-trigger-audio">Select Your Language</button>
                <ul class="select-menu"></ul>
            </div>
        </div>

        <div class="room-option">
            <label for="room-code">Enter a room code</label>
            <input type="text" id="room-code" placeholder="e.g. A7F9Q2" />
            <button onclick="joinRoom()">Join room</button>
        </div>

        <div class="divider">OR</div>

        <div class="room-option">
            <button class="generate-btn" onclick="generateRoom()">
                Generate a room code
            </button>
            <p id="generated-code"></p>
        </div>

        <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
</div>

</body>
</html>
