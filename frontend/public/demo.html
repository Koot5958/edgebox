<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>EdgeBox-Nova LLM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/select-lang.css" />
    <link rel="stylesheet" href="/css/style-meeting.css" />
</head>

<body>

<header class="app-header">
    <img src="images/logo3.png" width="90px"/>
    <h1>EdgeBox-Nova LLM</h1>
    <button class="start-btn" id="start-btn">START</button>
    <button class="stop-btn" id="stop-btn" disabled>STOP</button>
    <button class="back-btn" onclick="window.location.href='https://llmcore.ai/en/edgebox-nova'">
        BACK TO WEBSITE
    </button>
    <button class="theme-btn" id="theme-toggle">
        <span class="theme-icon">☀️</span>
        <span class="theme-text">Light Mode</span>
    </button>
</header>
<div class="room-container">
    <div class="room-pill">
        Room: <span id="room-display"></span>
    </div>
</div>
<div class="content-box">
    <div class="user-box">

        <div class="subt-box">
            <div id="space-line-transc" class="space-line-transc"></div>

            <div class="subt-line">
                <div class="subt-glass">
                    <span id="prev-subt-left"></span>
                </div>
            </div>

            <div class="subt-line">
                <div class="subt-glass">
                    <span id="curr-subt-left"></span>
                </div>
            </div>
        </div>
    </div>
    <div class="user-box">

        <div class="subt-box">
            <div id="space-line-transc" class="space-line-transc"></div>

            <div class="subt-line">
                <div class="subt-glass">
                    <span id="prev-subt-right"></span>
                </div>
            </div>

            <div class="subt-line">
                <div class="subt-glass">
                    <span id="curr-subt-right"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="app-footer">
    <div class="footer-left">
        <span>© 2026 EdgeBox-Nova</span>
    </div>

    <div class="footer-center">
        <span>Real-time Speech · Transcription · Translation</span>
    </div>

    <div class="footer-right">
        <a href="https://llmcore.ai/en/edgebox-nova">llmcore.ai</a>
    </div>
</footer>

<script src="/src/main-demo.js"></script>
<script src="/src/theme-toggle.js"></script>
</body>
</html>
